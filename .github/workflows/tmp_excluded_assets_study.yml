name: Temporary excluded-asset data study

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp_excluded_assets/**'
      - '.github/workflows/tmp_excluded_assets_study.yml'

permissions:
  contents: read

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pandas requests
      - run: python tmp_excluded_assets/fetch_excluded_assets.py
      - if: always()
        run: |
          cd /tmp
          zip -r excluded-assets-study.zip excluded_assets_output || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excluded-assets-study
          path: /tmp/excluded-assets-study.zip
          retention-days: 1
          if-no-files-found: error
