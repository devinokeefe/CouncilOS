name: Temporary portfolio extension through June 2026

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp_portfolio_extension/**'
      - '.github/workflows/tmp_portfolio_extension_jun2026.yml'

permissions:
  contents: read

jobs:
  fetch-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests

      - name: Fetch daily data through June 2026
        run: python tmp_portfolio_extension/fetch_extension.py

      - name: Package outputs
        if: always()
        run: |
          cd /tmp
          zip -r portfolio-extension-jun2026.zip portfolio_extension_output || true

      - name: Upload extension data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-extension-jun2026
          path: /tmp/portfolio-extension-jun2026.zip
          retention-days: 1
          if-no-files-found: error
