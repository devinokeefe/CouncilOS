roles:
  requirements_pod:
    model_provider: mock
    model_name: mock-v1
    temperature: 0.0
    max_tokens: 2000
    prompt_version_hash: requirements_v1
    tools_allowed: []
    output_schema: dynamic
  synthesizer_a:
    model_provider: mock_a
    model_name: mock-a-v1
    temperature: 0.0
    max_tokens: 2000
    prompt_version_hash: synth_a_v1
    tools_allowed: []
    output_schema: PlanPackage
  synthesizer_b:
    model_provider: mock_b
    model_name: mock-b-v1
    temperature: 0.0
    max_tokens: 2000
    prompt_version_hash: synth_b_v1
    tools_allowed: []
    output_schema: PlanPackage
  judge_1:
    model_provider: mock_j
    model_name: mock-j-v1
    temperature: 0.0
    max_tokens: 1200
    prompt_version_hash: judge_v1
    tools_allowed: []
    output_schema: JudgePairwisePayload
branching_policy:
  branch_count: 3
  keep_count: 2
  contrarian_rule: true
ensemble_policy:
  synthesizers_per_branch: 2
  triage_critics: 2
  failure_mode_analysts: 2
  judge_panel_size: 3
iteration_caps:
  max_candidate_repairs: 3
  max_pod_reruns: 2
  max_branch_rebuilds: 1
  max_full_cycles_without_pass: 2
schemas_version: "1.0.0"
validator_suite_version: "1.0.0"
selection_protocol_version: "1.0.0"
tools_enabled: false
store_full_prompts: false
storage_root: "CouncilOS/runs"
stage_machine_version: "1.0.0"
tracing:
  enabled: false
  provider: "noop"
tool_policy:
  stage_policies:
    - stage: PLANNING
      allowlisted_tools: []
      restrictions: []
      hitl_triggers: ["network_access", "write_outside_workspace", "shell_exec", "secrets_access"]
hitl_policy:
  when_to_interrupt: ["blocking_unknowns", "high_severity_decision", "tool_approval_required"]
  approval_roles: ["user", "human_reviewer"]

feedback:
  clarify: false
  plan_review: false
  provider: auto
  max_plan_review_rounds: 10
  require_explicit_approval: true
