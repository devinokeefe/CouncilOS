roles:
  requirements_pod:
    model_provider: openrouter
    model_name: openai/gpt-5-mini
    temperature: 0.2
    max_tokens: 4000
    prompt_version_hash: requirements_v2
    tools_allowed: []
    output_schema: dynamic
  synthesizer_a:
    model_provider: openrouter
    model_name: openai/gpt-5-mini
    temperature: 0.2
    max_tokens: 2500
    prompt_version_hash: synth_a_v2
    tools_allowed: []
    output_schema: PlanPackage
  synthesizer_b:
    model_provider: openrouter
    model_name: openai/gpt-5-mini
    temperature: 0.2
    max_tokens: 2500
    prompt_version_hash: synth_b_v2
    tools_allowed: []
    output_schema: PlanPackage
  judge_1:
    model_provider: openrouter
    model_name: openai/gpt-5-mini
    temperature: 0.0
    max_tokens: 1200
    prompt_version_hash: judge_v2
    tools_allowed: []
    output_schema: JudgePairwisePayload
branching_policy:
  branch_count: 1
  keep_count: 1
  contrarian_rule: false
ensemble_policy:
  synthesizers_per_branch: 1
  triage_critics: 2
  failure_mode_analysts: 1
  judge_panel_size: 3
iteration_caps:
  max_candidate_repairs: 2
  max_pod_reruns: 1
  max_branch_rebuilds: 0
  max_full_cycles_without_pass: 1
portfolio_diversity: false
schemas_version: "1.0.0"
validator_suite_version: "1.0.0"
selection_protocol_version: "1.0.0"
tools_enabled: false
store_full_prompts: false
storage_root: "CouncilOS/runs"
stage_machine_version: "1.0.0"
tracing:
  enabled: false
  provider: "noop"
tool_policy:
  stage_policies:
    - stage: PLANNING
      allowlisted_tools: []
      restrictions: []
      hitl_triggers: ["network_access", "write_outside_workspace", "shell_exec", "secrets_access"]
hitl_policy:
  when_to_interrupt: []
  approval_roles: ["user", "human_reviewer"]

feedback:
  clarify: false
  plan_review: false
  provider: auto
  max_plan_review_rounds: 10
  require_explicit_approval: true
