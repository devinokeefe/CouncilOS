[project]
name = "council-os"
version = "0.1.0"
description = "Council OS Planning System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
  "jsonpatch>=1.33,<2",
  "fastapi>=0.111,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "mypy>=1.10,<2",
  "ruff>=0.6,<1",
  "black>=24.0,<25",
  "types-PyYAML>=6.0.12",
  "httpx>=0.27,<1",
]

[project.scripts]
council = "council_os.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["council_os*"]

[tool.setuptools.package-data]
"council_os.agents.prompts" = ["*.txt", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = "jsonpatch"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "council_os.service"
ignore_errors = true
